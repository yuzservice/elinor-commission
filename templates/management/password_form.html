{% extends 'base.html' %}
{% block content %}
<div class="page-head">
    <div>
        <p class="eyebrow">امنیت حساب</p>
        <h1>تغییر رمز {{ employee.full_name }}</h1>
        <p>مقدار رمز در Audit Log ذخیره نمی‌شود.</p>
    </div>
    <a class="secondary" href="{% url 'management_employee_detail' employee.pk %}?tab=edit">بازگشت به پرونده</a>
</div>
<article class="card form-card">
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="primary">ثبت رمز جدید</button>
    </form>
</article>
{% endblock %}
